    <div class="dua" style="text-align: center;">

        <div id="box" style="text-align: center;">
            <!-- Sarahah! -->
            <input id="chooseImage" type="file" name="file" accept="image/*">
            <button class="file-input-trigger" style="font-family: Unifont, DotGothic16;">選択圖片</button>
            &NonBreakingSpace;
            <button id="addButton">增加按钮</button>
            <!-- <input type="button" value=""> -->
        </div>
        <script>
            $("#chooseImage").on('change', function(){
                let file = this.files[0];
                if (file) {
                    let reader = new FileReader();
                    reader.onload = function(e) {
                        $('#img-avatar').attr('src', e.target.result);
                    };
                    reader.readAsDataURL(file);
                }
            });
            $('.file-input-trigger').on('click', function() {
                $('#chooseImage').trigger('click');
            });
        </script>

        <br>
        
        <table id="buttonTable" border="1" style="background: #cccccc;width: 20em;text-align: center; font-size: 0.8em;">
            <thead style="height: 1.2em;">
                <tr>
                    <th>按钮名称</th>
                    <th>操作</th>
                </tr>
            </thead>
            <tbody>
                <!-- 动态添加的按钮行将放在这里 -->
            </tbody>
        </table>
        <script>
            document.getElementById('addButton').addEventListener('click', function() {
                // 创建一个新的表格行
                var newRow = document.createElement('tr');

                // 创建按钮名称单元格
                var nameCell = document.createElement('td');
                var nameInput = document.createElement('input');
                nameInput.type = 'text';
                nameInput.value = '新按钮';
                nameCell.appendChild(nameInput);

                // 创建操作单元格
                var actionCell = document.createElement('td');
                var deleteButton = document.createElement('button');
                deleteButton.textContent = '删除';
                deleteButton.addEventListener('click', function() {
                    newRow.remove();
                    newButton.remove();
                });
                actionCell.appendChild(deleteButton);

                // 将单元格添加到行中
                newRow.appendChild(nameCell);
                newRow.appendChild(actionCell);

                // 将行添加到表格中
                document.getElementById('buttonTable').getElementsByTagName('tbody')[0].appendChild(newRow);
                
                // 创建新的按钮并添加到box中
                var newButton = document.createElement('button');
                newButton.textContent = nameInput.value;
                newButton.setAttribute('data-name', nameInput.value);
                newButton.style.margin = '5px';
                document.getElementById('box').appendChild(newButton);

                // 监听输入框的变化来更新按钮的文本
                nameInput.addEventListener('input', function() {
                    newButton.textContent = nameInput.value;
                    newButton.setAttribute('data-name', nameInput.value);
                });
            });
        </script>

            图片透明度&nbsp;&nbsp;
            <label>
                <input type="range" id="slider" min="0" max="1" step="0.01" value="1">
            </label>
            <label>
                <input type="number" id="input_num" min="0" max="1" step="0.01" value="1">
            </label>
        </div>
        <script>
            // 获取元素
            const target = document.getElementById('img-avatar');
            const slider = document.getElementById('slider');
            const input = document.getElementById('input_num');

            // 滑动条改变时更新透明度和输入框的值
            slider.addEventListener('input', () => {
                const opacity = slider.value;
                target.style.opacity = opacity;
                input.value = opacity;
            });

            // 输入框改变时更新透明度和滑动条的值
            input.addEventListener('input', () => {
                const opacity = input.value;
                target.style.opacity = opacity;
                slider.value = opacity;
            });
        </script>

        <script>
            const trg = document.getElementById('title');
            const redSlider = document.getElementById('slider_r');
            const greenSlider = document.getElementById('slider_g');
            const blueSlider = document.getElementById('slider_b');
            const redValue = document.getElementById('input_r');
            const greenValue = document.getElementById('input_g');
            const blueValue = document.getElementById('input_b');
            var imgAvatar = document.getElementById('img-avatar');

            imgAvatar.onload = function() {
                // 创建隐藏的Canvas并绘制图片
                const canvas = document.createElement('canvas');
                canvas.width = imgAvatar.naturalWidth;
                canvas.height = imgAvatar.naturalHeight;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(imgAvatar, 0, 0);

                // 点击事件处理
                imgAvatar.addEventListener('click', function(event) {
                    // 计算点击位置相对于图片的实际坐标
                    const rect = imgAvatar.getBoundingClientRect();
                    const scaleX = imgAvatar.naturalWidth / imgAvatar.clientWidth;
                    const scaleY = imgAvatar.naturalHeight / imgAvatar.clientHeight;
                    
                    const x = (event.clientX - rect.left) * scaleX;
                    const y = (event.clientY - rect.top) * scaleY;

                    // 确保坐标在图片范围内
                    if (x < 0 || x >= imgAvatar.naturalWidth || y < 0 || y >= imgAvatar.naturalHeight) return;

                    // 获取像素数据
                    const pixel = ctx.getImageData(Math.floor(x), Math.floor(y), 1, 1).data;
                    
                    var red = pixel[0];
                    var green = pixel[1];
                    var blue = pixel[2];

                    // // 显示结果
                    // const rgb = `RGB(${pixel[0]}, ${pixel[1]}, ${pixel[2]})`;
                    
                    trg.style.backgroundColor = `rgb(${red}, ${green}, ${blue})`;

                    // 更新显示的值
                    redValue.value = red;
                    greenValue.value = green;
                    blueValue.value = blue;
                    // document.getElementById('result').textContent = rgb;
                    
                    // 更新显示的值
                    redSlider.value = red;
                    greenSlider.value = green;
                    blueSlider.value = blue;
                });
            };

            // 处理图片加载错误
            imgAvatar.onerror = function() {
                console.error('图片加载失败，请检查URL是否正确或CORS设置');
            };

            // 更新背景颜色
            function updateBackgroundColor() {
                const red = redSlider.value;
                const green = greenSlider.value;
                const blue = blueSlider.value;

                // 设置目标控件的背景颜色
                trg.style.backgroundColor = `rgba(${red}, ${green}, ${blue})`;

                // 更新显示的值
                redValue.value = red;
                greenValue.value = green;
                blueValue.value = blue;
            }

            // 更新背景颜色
            function updateBackgroundColor_2() {
                const red = redValue.value;
                const green = greenValue.value;
                const blue = blueValue.value;

                // 设置目标控件的背景颜色
                trg.style.backgroundColor = `rgba(${red}, ${green}, ${blue})`;

                // 更新显示的值
                redSlider.value = red;
                greenSlider.value = green;
                blueSlider.value = blue;
            }


            // 监听滑动条的变化
            redSlider.addEventListener('input', updateBackgroundColor);
            greenSlider.addEventListener('input', updateBackgroundColor);
            blueSlider.addEventListener('input', updateBackgroundColor);
            

            redValue.addEventListener('input', updateBackgroundColor_2);
            greenValue.addEventListener('input', updateBackgroundColor_2);
            blueValue.addEventListener('input', updateBackgroundColor_2);
            
            // 初始化
            updateBackgroundColor();
            updateBackgroundColor_2();
        </script>

        <script>
            function imgSrcToDataURL(img) {
                var src = img.getAttribute('src') || '';
                if (!src || src.indexOf('data:') === 0) {
                    return Promise.resolve();
                }
                return fetch(src).then(function(res) {
                    if (!res.ok) throw new Error('fetch image failed: ' + res.status);
                    return res.blob();
                }).then(function(blob) {
                    return new Promise(function(resolve, reject) {
                        var reader = new FileReader();
                        reader.onload = function() { resolve(reader.result); };
                        reader.onerror = reject;
                        reader.readAsDataURL(blob);
                    });
                }).then(function(dataUrl) {
                    return new Promise(function(resolve, reject) {
                        img.onload = function() { resolve(); };
                        img.onerror = reject;
                        img.removeAttribute('crossorigin');
                        img.src = dataUrl;
                    });
                }).catch(function(err) {
                    console.warn('导出前转换图片失败:', src, err);
                });
            }

            function ensureExportImagesClean(root) {
                var imgs = root.querySelectorAll('img');
                var tasks = [];
                for (var i = 0; i < imgs.length; i++) {
                    tasks.push(imgSrcToDataURL(imgs[i]));
                }
                return Promise.all(tasks);
            }

            // 仅稳定处理：外框、标题栏、右侧固定关闭钮（导出前写入 inline）
            function applyExportEmboss(root) {
                var titleEl = root.querySelector('#title');
                var closeBtn = root.querySelector('.btn div');
                var targets = [root];
                if (titleEl) targets.push(titleEl);
                if (closeBtn) targets.push(closeBtn);
                var backups = [];
                for (var i = 0; i < targets.length; i++) {
                    var el = targets[i];
                    backups.push({
                        el: el,
                        cssText: el.style.cssText
                    });
                    if (el === root) {
                        el.style.boxSizing = 'border-box';
                        el.style.borderStyle = 'solid';
                        el.style.borderWidth = '2px';
                        el.style.borderTopColor = '#ffffff';
                        el.style.borderLeftColor = '#ffffff';
                        el.style.borderRightColor = '#000000';
                        el.style.borderBottomColor = '#000000';
                        el.style.boxShadow = 'none';
                    } else if (el === titleEl) {
                        el.style.boxSizing = 'border-box';
                        el.style.height = '22px';
                        el.style.lineHeight = '16px';
                        el.style.fontSize = '12px';
                        el.style.padding = '3px 3px 3px 4px';
                        el.style.overflow = 'hidden';
                        el.style.color = '#ffffff';
                    } else if (el === closeBtn) {
                        el.style.boxSizing = 'border-box';
                        el.style.borderStyle = 'solid';
                        el.style.borderWidth = '2px';
                        el.style.borderTopColor = '#ffffff';
                        el.style.borderLeftColor = '#ffffff';
                        el.style.borderRightColor = '#000000';
                        el.style.borderBottomColor = '#000000';
                        el.style.boxShadow = 'none';
                        el.style.width = '16px';
                        el.style.height = '14px';
                        el.style.backgroundColor = '#c0c0c0';
                        el.style.lineHeight = '10px';
                        el.style.fontSize = '12px';
                        el.style.fontFamily = 'Arial, Helvetica, sans-serif';
                        el.style.textAlign = 'center';
                        el.style.color = '#000000';
                    }
                }
                return function restoreExportEmboss() {
                    for (var j = 0; j < backups.length; j++) {
                        backups[j].el.style.cssText = backups[j].cssText;
                    }
                };
            }

            document.getElementById('exportButton').addEventListener('click', function() {
                var element = document.getElementById('jw_classic'); // 获取你想要导出的 <div> 的 ID
                var restoreEmboss = null;
                ensureExportImagesClean(element).then(function() {
                    restoreEmboss = applyExportEmboss(element);
                    element.offsetHeight; // 强制重绘后再截图
                    return html2canvas(element, {
                        useCORS: true, // 允许跨域请求，如果div中有来自不同域名的资源
                        allowTaint: false,
                        backgroundColor: null, // 设置背景颜色为null以保持透明度
                        scale: 2, // 可选：提高输出图像的质量
                        dpi: window.devicePixelRatio // 根据设备像素比调整分辨率
                    });
                }).then(function(canvas) {
                    if (restoreEmboss) restoreEmboss();
                    // 将 canvas 转换为图片，并创建一个下载链接
                    var imgData = canvas.toDataURL('image/png');
                    var link = document.createElement('a');
                    link.href = imgData;
                    link.download = 'exported-image.png'; // 设置文件名
                    link.click();
                }).catch(function(err) {
                    if (restoreEmboss) restoreEmboss();
                    console.error(err);
                    alert('导出失败：画布被跨域图片污染。请确认标题图标/内容图可同源访问，或重新选择图片后再试。');
                });
            });
