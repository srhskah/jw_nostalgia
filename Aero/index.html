        <script>
            document.getElementById('addTop').addEventListener('click', function() {
                // 创建一个新的表格行
                var newRow = document.createElement('tr');

                // 创建按钮名称单元格

                var nameInput = document.createElement('input');

        <script>
            // 获取元素
            const target = document.getElementById('img-avatar');
            const slider = document.getElementById('slider');
            const input = document.getElementById('input_num');

            // 滑动条改变时更新透明度和输入框的值
            slider.addEventListener('input', () => {
                const opacity = slider.value;
                target.style.opacity = opacity;
                input.value = opacity;
            });

            // 输入框改变时更新透明度和滑动条的值
            input.addEventListener('input', () => {
                const opacity = input.value;
                target.style.opacity = opacity;
                slider.value = opacity;
            });
        </script>
        <script>
            const trg = document.getElementById('jw_aero');
            const redSlider = document.getElementById('slider_r');
            const greenSlider = document.getElementById('slider_g');
            const blueSlider = document.getElementById('slider_b');
            const alphaSlider = document.getElementById('slider_a');
            const redValue = document.getElementById('input_r');
            const greenValue = document.getElementById('input_g');
            const blueValue = document.getElementById('input_b');
            const alphaValue = document.getElementById('input_a');
            var imgAvatar = document.getElementById('img-avatar');

            
            imgAvatar.onload = function() {
                // 创建隐藏的Canvas并绘制图片
                const canvas = document.createElement('canvas');
                canvas.width = imgAvatar.naturalWidth;
                canvas.height = imgAvatar.naturalHeight;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(imgAvatar, 0, 0);

                // 点击事件处理
                imgAvatar.addEventListener('click', function(event) {
                    // 计算点击位置相对于图片的实际坐标
                    const rect = imgAvatar.getBoundingClientRect();
                    const scaleX = imgAvatar.naturalWidth / imgAvatar.clientWidth;
                    const scaleY = imgAvatar.naturalHeight / imgAvatar.clientHeight;
                    
                    const x = (event.clientX - rect.left) * scaleX;
                    const y = (event.clientY - rect.top) * scaleY;

                    // 确保坐标在图片范围内
                    if (x < 0 || x >= imgAvatar.naturalWidth || y < 0 || y >= imgAvatar.naturalHeight) return;

                    // 获取像素数据
                    const pixel = ctx.getImageData(Math.floor(x), Math.floor(y), 1, 1).data;
                    
                    var red = pixel[0];
                    var green = pixel[1];
                    var blue = pixel[2];
                    var alpha = pixel[3]/255;

                    // // 显示结果
                    // const rgb = `RGB(${pixel[0]}, ${pixel[1]}, ${pixel[2]})`;
                    
                    // trg.style.backgroundColor = `rgba(${red}, ${green}, ${blue}, ${alpha})`;

                    trg.style.background = `linear-gradient(0deg, rgba(${Math.max(red-32,0)}, ${Math.max(green-32,0)}, ${Math.max(blue-32,0)}, ${alpha}) 0%, rgba(${Math.max(red-96,0)}, ${Math.max(green-96,0)}, ${Math.max(blue-96,0)}, ${alpha}) 49%, rgba(${Math.max(red-64,0)}, ${Math.max(green-64,0)}, ${Math.max(blue-64,0)}, ${alpha}) 51%, rgba(${red}, ${green}, ${blue}, ${alpha}) 100%) padding-box`;
                    trg.style.border = `0.2em solid rgba(${red}, ${green}, ${blue}, ${0.5})`;

                    // 更新显示的值
                    redValue.value = red;
                    greenValue.value = green;
                    blueValue.value = blue;
                    alphaValue.value = alpha;
                    // document.getElementById('result').textContent = rgb;
                    
                    // 更新显示的值
                    redSlider.value = red;
                    greenSlider.value = green;
                    blueSlider.value = blue;
                    alphaSlider.value = alpha;
                });
            };

            // 处理图片加载错误
            imgAvatar.onerror = function() {
                console.error('图片加载失败，请检查URL是否正确或CORS设置');
            };

            // 更新背景颜色
            function updateBackgroundColor() {
                const red = redSlider.value;
                const green = greenSlider.value;
                const blue = blueSlider.value;
                const alpha = alphaSlider.value;

                // 设置目标控件的背景颜色
                // trg.style.backgroundColor = `rgba(${red}, ${green}, ${blue}, ${alpha})`;
                trg.style.background = `linear-gradient(0deg, rgba(${Math.max(red-32,0)}, ${Math.max(green-32,0)}, ${Math.max(blue-32,0)}, ${alpha}) 0%, rgba(${Math.max(red-96,0)}, ${Math.max(green-96,0)}, ${Math.max(blue-96,0)}, ${alpha}) 49%, rgba(${Math.max(red-64,0)}, ${Math.max(green-64,0)}, ${Math.max(blue-64,0)}, ${alpha}) 51%, rgba(${red}, ${green}, ${blue}, ${alpha}) 100%) padding-box`;
                trg.style.border = `0.2em solid rgba(${red}, ${green}, ${blue}, ${0.5})`;

                // 更新显示的值
                redValue.value = red;
                greenValue.value = green;
                blueValue.value = blue;
                alphaValue.value = alpha;
            }

            // 更新背景颜色
            function updateBackgroundColor_2() {
                const red = redValue.value;
                const green = greenValue.value;
                const blue = blueValue.value;
                const alpha = alphaValue.value;

                // 设置目标控件的背景颜色
                // trg.style.backgroundColor = `rgba(${red}, ${green}, ${blue}, ${alpha})`;
                trg.style.background = `linear-gradient(0deg, rgba(${Math.max(red-32,0)}, ${Math.max(green-32,0)}, ${Math.max(blue-32,0)}, ${alpha}) 0%, rgba(${Math.max(red-96,0)}, ${Math.max(green-96,0)}, ${Math.max(blue-96,0)}, ${alpha}) 49%, rgba(${Math.max(red-64,0)}, ${Math.max(green-64,0)}, ${Math.max(blue-64,0)}, ${alpha}) 51%, rgba(${red}, ${green}, ${blue}, ${alpha}) 100%) padding-box`;
                trg.style.border = `0.2em solid rgba(${red}, ${green}, ${blue}, ${0.5})`;

                // 更新显示的值
                redSlider.value = red;
                greenSlider.value = green;
                blueSlider.value = blue;
                alphaSlider.value = alpha;
            }


            // 监听滑动条的变化
            redSlider.addEventListener('input', updateBackgroundColor);
            greenSlider.addEventListener('input', updateBackgroundColor);
            blueSlider.addEventListener('input', updateBackgroundColor);
            alphaSlider.addEventListener('input', updateBackgroundColor);


            redValue.addEventListener('input', updateBackgroundColor_2);
            greenValue.addEventListener('input', updateBackgroundColor_2);
            blueValue.addEventListener('input', updateBackgroundColor_2);
            alphaValue.addEventListener('input', updateBackgroundColor_2);

            // 初始化
            updateBackgroundColor();
            updateBackgroundColor_2();
        </script>

        <button id="exportButton">导出对话框为图片</button>
        <script>
            document.getElementById('exportButton').addEventListener('click', function() {
                var element = document.getElementById('jw_aero'); // 获取你想要导出的 <div> 的 ID
                
                // 保存原始样式
                const closeBtn = document.getElementById('close_btn');
                const addBtn = document.getElementById('add_btn');
                const reduceBtn = document.getElementById('reduce_btn');
                
                const originalCloseLineHeight = closeBtn.style.lineHeight;
                const originalAddLineHeight = addBtn.style.lineHeight;
                const originalReduceLineHeight = reduceBtn.style.lineHeight;
                
                // 保存 #jw_aero 的原始样式
                const jwAero = document.getElementById('jw_aero');
                const title = document.getElementById('title');
                const imgs = document.getElementById('imgs');
                
                const originalJwAeroStyles = {
                    margin: jwAero.style.margin,
                    backgroundClip: jwAero.style.backgroundClip,
                    overflow: jwAero.style.overflow,
                    position: jwAero.style.position
                };
                
                const originalTitleStyles = {
                    position: title.style.position
                };
                
                // 临时调整按钮样式用于导出
                [closeBtn, addBtn, reduceBtn].forEach(btn => {
                    btn.style.display = 'flex';
                    btn.style.alignItems = 'center';
                    btn.style.justifyContent = 'center';
                    btn.style.padding = '0';
                    btn.style.lineHeight = '4';
                });

                // reduceBtn.style.lineHeight = '999em';
                
                // 调整 #jw_aero 和其子元素的样式
                jwAero.style.margin = '0';
                jwAero.style.backgroundClip = 'border-box';
                jwAero.style.overflow = 'visible';
                jwAero.style.position = 'relative';
                
                // 确保标题正常显示
                title.style.position = 'relative';
                title.style.zIndex = '1';
                
                // 确保图片容器正常显示并水平居中
                // imgs.style.width = '100%';
                // imgs.style.maxWidth = '100%';
                // // imgs.style.margin = '0 auto auto';
                // imgs.style.display = 'flex';
                // imgs.style.justifyContent = 'center';
                // imgs.style.overflow = 'hidden';
                
                const new_btn = document.getElementsByClassName('new_btn');
                for(let i = 0; i < new_btn.length; i++){
                    new_btn[i].style.padding = '2px 5px 0.4em';
                    // new_btn[i].style.padding = '0.2em 0.8em 0.4em';
                }
                // btn.style.padding = '2px 5px 0.4em';

                // 强制重绘
                element.offsetHeight;
                
                html2canvas(element, {
                    useCORS: true, // 允许跨域请求，如果div中有来自不同域名的资源
                    backgroundColor: null, // 设置背景颜色为null以保持透明度
                    scale: 6, // 可选：提高输出图像的质量
                    dpi: window.devicePixelRatio // 根据设备像素比调整分辨率
                }).then(function(canvas) {
                    // 将 canvas 转换为图片，并创建一个下载链接
                    var imgData = canvas.toDataURL('image/png');
                    var link = document.createElement('a');
                    link.href = imgData;
                    link.download = 'exported-image.png'; // 设置文件名
                    link.click();
                    // 恢复按钮原始样式
                    [closeBtn, addBtn, reduceBtn].forEach(btn => {
                        btn.style.display = '';
                        btn.style.alignItems = '';
                        btn.style.justifyContent = '';
                        btn.style.padding = '';
                        btn.style.lineHeight = '';
                    });
                    
                    // 恢复所有元素的原始样式
                    Object.keys(originalJwAeroStyles).forEach(prop => {
                        jwAero.style[prop] = originalJwAeroStyles[prop];
                    });
                    
                    Object.keys(originalTitleStyles).forEach(prop => {
                        title.style[prop] = originalTitleStyles[prop];
                    });
                    
                    // 重置图片容器样式
                    imgs.style.width = '';
                    imgs.style.maxWidth = '';
                    imgs.style.margin = '';
                    imgs.style.display = '';
                    imgs.style.justifyContent = '';
                    imgs.style.overflow = '';

                    for(let i = 0; i < new_btn.length; i++){
                        new_btn[i].style.padding = '';
                    }
                });
            },3000);
        </script>
