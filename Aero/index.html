        <script>
            const trg = document.getElementById('jw_aero');
            const redSlider = document.getElementById('slider_r');
            const greenSlider = document.getElementById('slider_g');
            const blueSlider = document.getElementById('slider_b');
            const alphaSlider = document.getElementById('slider_a');
            const redValue = document.getElementById('input_r');
            const greenValue = document.getElementById('input_g');
            const blueValue = document.getElementById('input_b');
            const alphaValue = document.getElementById('input_a');
            var imgAvatar = document.getElementById('img-avatar');

            
            imgAvatar.onload = function() {
                // 创建隐藏的Canvas并绘制图片
                const canvas = document.createElement('canvas');
                canvas.width = imgAvatar.naturalWidth;
                canvas.height = imgAvatar.naturalHeight;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(imgAvatar, 0, 0);

                // 点击事件处理
                imgAvatar.addEventListener('click', function(event) {
                    // 计算点击位置相对于图片的实际坐标
                    const rect = imgAvatar.getBoundingClientRect();
                    const scaleX = imgAvatar.naturalWidth / imgAvatar.clientWidth;
                    const scaleY = imgAvatar.naturalHeight / imgAvatar.clientHeight;
                    
                    const x = (event.clientX - rect.left) * scaleX;
                    const y = (event.clientY - rect.top) * scaleY;

                    // 确保坐标在图片范围内
                    if (x < 0 || x >= imgAvatar.naturalWidth || y < 0 || y >= imgAvatar.naturalHeight) return;

                    // 获取像素数据
                    const pixel = ctx.getImageData(Math.floor(x), Math.floor(y), 1, 1).data;
                    
                    var red = pixel[0];
                    var green = pixel[1];
                    var blue = pixel[2];
                    var alpha = pixel[3]/255;

                    // // 显示结果
                    // const rgb = `RGB(${pixel[0]}, ${pixel[1]}, ${pixel[2]})`;
                    
                    // trg.style.backgroundColor = `rgba(${red}, ${green}, ${blue}, ${alpha})`;

                    trg.style.background = `linear-gradient(0deg, rgba(${Math.max(red-32,0)}, ${Math.max(green-32,0)}, ${Math.max(blue-32,0)}, ${alpha}) 0%, rgba(${Math.max(red-96,0)}, ${Math.max(green-96,0)}, ${Math.max(blue-96,0)}, ${alpha}) 49%, rgba(${Math.max(red-64,0)}, ${Math.max(green-64,0)}, ${Math.max(blue-64,0)}, ${alpha}) 51%, rgba(${red}, ${green}, ${blue}, ${alpha}) 100%) padding-box`;
                    trg.style.border = `0.2em solid rgba(${red}, ${green}, ${blue}, ${0.5})`;

                    // 更新显示的值
                    redValue.value = red;
                    greenValue.value = green;
                    blueValue.value = blue;
                    alphaValue.value = alpha;
                    // document.getElementById('result').textContent = rgb;
                    
                    // 更新显示的值
                    redSlider.value = red;
                    greenSlider.value = green;
                    blueSlider.value = blue;
                    alphaSlider.value = alpha;
                });
            };

            // 处理图片加载错误
            imgAvatar.onerror = function() {
                console.error('图片加载失败，请检查URL是否正确或CORS设置');
            };

            // 更新背景颜色
            function updateBackgroundColor() {
                const red = redSlider.value;
                const green = greenSlider.value;
                const blue = blueSlider.value;
                const alpha = alphaSlider.value;

                // 设置目标控件的背景颜色
                // trg.style.backgroundColor = `rgba(${red}, ${green}, ${blue}, ${alpha})`;
                trg.style.background = `linear-gradient(0deg, rgba(${Math.max(red-32,0)}, ${Math.max(green-32,0)}, ${Math.max(blue-32,0)}, ${alpha}) 0%, rgba(${Math.max(red-96,0)}, ${Math.max(green-96,0)}, ${Math.max(blue-96,0)}, ${alpha}) 49%, rgba(${Math.max(red-64,0)}, ${Math.max(green-64,0)}, ${Math.max(blue-64,0)}, ${alpha}) 51%, rgba(${red}, ${green}, ${blue}, ${alpha}) 100%) padding-box`;
                trg.style.border = `3px solid rgba(${red}, ${green}, ${blue}, ${0.5})`;

                // 更新显示的值
                redValue.value = red;
                greenValue.value = green;
                blueValue.value = blue;
                alphaValue.value = alpha;
            }

            // 更新背景颜色
            function updateBackgroundColor_2() {
                const red = redValue.value;

                trg.style.background = `linear-gradient(0deg, rgba(${Math.max(red-32,0)}, ${Math.max(green-32,0)}, ${Math.max(blue-32,0)}, ${alpha}) 0%, rgba(${Math.max(red-96,0)}, ${Math.max(green-96,0)}, ${Math.max(blue-96,0)}, ${alpha}) 49%, rgba(${Math.max(red-64,0)}, ${Math.max(green-64,0)}, ${Math.max(blue-64,0)}, ${alpha}) 51%, rgba(${red}, ${green}, ${blue}, ${alpha}) 100%) padding-box`;
                trg.style.border = `3px solid rgba(${red}, ${green}, ${blue}, ${0.5})`;

                // 更新显示的值
                redSlider.value = red;
                greenSlider.value = green;
                blueSlider.value = blue;
                alphaSlider.value = alpha;
            }


            // 监听滑动条的变化

        <script>
            function imgSrcToDataURL(img) {
                var src = img.getAttribute('src') || '';
                if (!src || src.indexOf('data:') === 0) {
                    return Promise.resolve();
                }
                return fetch(src).then(function(res) {
                    if (!res.ok) throw new Error('fetch image failed: ' + res.status);
                    return res.blob();
                }).then(function(blob) {
                    return new Promise(function(resolve, reject) {
                        var reader = new FileReader();
                        reader.onload = function() { resolve(reader.result); };
                        reader.onerror = reject;
                        reader.readAsDataURL(blob);
                    });
                }).then(function(dataUrl) {
                    return new Promise(function(resolve, reject) {
                        img.onload = function() { resolve(); };
                        img.onerror = reject;
                        img.removeAttribute('crossorigin');
                        img.src = dataUrl;
                    });
                }).catch(function(err) {
                    console.warn('导出前转换图片失败:', src, err);
                });
            }

            function ensureExportImagesClean(root) {
                var imgs = root.querySelectorAll('img');
                var tasks = [];
                for (var i = 0; i < imgs.length; i++) {
                    tasks.push(imgSrcToDataURL(imgs[i]));
                }
                return Promise.all(tasks);
            }

            // 与桌面参考导出接近的固定版心（px），避免手机 width:25% 导致比例错乱
            var EXPORT_LAYOUT_WIDTH = 380;

            function downloadCanvasPng(canvas, filename) {
                function trigger(href) {
                    var link = document.createElement('a');
                    link.href = href;
                    link.download = filename || 'exported-image.png';
                    link.rel = 'noopener';
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                }
                if (canvas.toBlob) {
                    canvas.toBlob(function(blob) {
                        if (!blob) {
                            trigger(canvas.toDataURL('image/png'));
                            return;
                        }
                        var url = URL.createObjectURL(blob);
                        trigger(url);
                        setTimeout(function() { URL.revokeObjectURL(url); }, 4000);
                    }, 'image/png');
                } else {
                    trigger(canvas.toDataURL('image/png'));
                }
            }

            // 仅稳定处理：版心宽度、外框、标题栏、圆形标题钮、底栏 .new_btn
            function applyExportChrome(root) {
                var backups = [];
                function backup(el) {
                    if (!el) return;
                    backups.push({ el: el, cssText: el.style.cssText });
                }

                backup(root);
                // 移出视口并锁宽，避免窄屏裁切 / transform 干扰 html2canvas
                root.style.position = 'fixed';
                root.style.left = '-10000px';
                root.style.top = '0';
                root.style.transform = 'none';
                root.style.margin = '0';
                root.style.width = EXPORT_LAYOUT_WIDTH + 'px';
                root.style.minWidth = EXPORT_LAYOUT_WIDTH + 'px';
                root.style.maxWidth = EXPORT_LAYOUT_WIDTH + 'px';
                root.style.backgroundClip = 'border-box';
                root.style.overflow = 'visible';
                root.style.boxSizing = 'border-box';
                root.style.borderRadius = '8px';
                var borderColor = root.style.borderColor || window.getComputedStyle(root).borderColor;
                root.style.borderStyle = 'solid';
                root.style.borderWidth = '3px';
                if (borderColor) root.style.borderColor = borderColor;

                var titleEl = root.querySelector('#title');
                backup(titleEl);
                if (titleEl) {
                    titleEl.style.position = 'relative';
                    titleEl.style.zIndex = '1';
                    titleEl.style.boxSizing = 'border-box';
                    titleEl.style.margin = '5px';
                    titleEl.style.height = '30px';
                    titleEl.style.lineHeight = '22px';
                    titleEl.style.fontSize = '13px';
                    titleEl.style.padding = '4px 3px';
                    titleEl.style.overflow = 'visible';
                    titleEl.style.color = '#000000';
                }

                var captionIds = ['close_btn', 'add_btn', 'reduce_btn'];
                for (var c = 0; c < captionIds.length; c++) {
                    var cap = document.getElementById(captionIds[c]);
                    backup(cap);
                    if (!cap) continue;
                    cap.style.boxSizing = 'border-box';
                    cap.style.display = 'flex';
                    cap.style.alignItems = 'center';
                    cap.style.justifyContent = 'center';
                    cap.style.width = '22px';
                    cap.style.height = '22px';
                    cap.style.borderRadius = '50%';
                    cap.style.border = '3px solid #ffffff';
                    cap.style.padding = '0';
                    cap.style.margin = '0 2px';
                    cap.style.lineHeight = '1';
                    cap.style.fontSize = '14px';
                    cap.style.fontFamily = 'Arial, Helvetica, sans-serif';
                    cap.style.color = '#ffffff';
                }

                var imgs = root.querySelector('#imgs');
                backup(imgs);
                if (imgs) {
                    imgs.style.maxWidth = '100%';
                    imgs.style.boxSizing = 'border-box';
                    imgs.style.overflow = 'hidden';
                }
                var avatar = root.querySelector('#img-avatar');
                backup(avatar);
                if (avatar) {
                    avatar.style.maxWidth = '100%';
                    avatar.style.width = '100%';
                    avatar.style.height = 'auto';
                    avatar.style.display = 'block';
                }

                var newBtns = root.querySelectorAll('.new_btn');
                for (var n = 0; n < newBtns.length; n++) {
                    var nb = newBtns[n];
                    backup(nb);
                    nb.style.appearance = 'none';
                    nb.style.webkitAppearance = 'none';
                    nb.style.boxSizing = 'border-box';
                    nb.style.padding = '2px 8px';
                    nb.style.border = '3px solid #ffffff';
                    nb.style.borderRadius = '8px';
                    nb.style.fontSize = '13px';
                    nb.style.lineHeight = '18px';
                    nb.style.fontFamily = "'Segoe UI', 'HarmonyOS Sans SC', sans-serif";
                    nb.style.background = 'linear-gradient(0deg, rgba(245,245,245,1) 0%, rgba(225,225,225,1) 49%, rgba(235,235,235,1) 51%, rgba(255,255,255,1) 100%)';
                    nb.style.color = '#000000';
                    nb.style.margin = '5px';
                }

                return function restoreExportChrome() {
                    for (var j = 0; j < backups.length; j++) {
                        backups[j].el.style.cssText = backups[j].cssText;
                    }
                };
            }

            document.getElementById('exportButton').addEventListener('click', function() {
                var element = document.getElementById('jw_aero');
                var restoreChrome = null;
                var fontsReady = (document.fonts && document.fonts.ready) ? document.fonts.ready : Promise.resolve();

                fontsReady.then(function() {
                    return ensureExportImagesClean(element);
                }).then(function() {
                    restoreChrome = applyExportChrome(element);
                    element.offsetHeight; // 强制重绘后再截图
                    return html2canvas(element, {
                        useCORS: true,
                        allowTaint: false,
                        backgroundColor: null,
                        scale: 6,
                        scrollX: 0,
                        scrollY: 0,
                        windowWidth: EXPORT_LAYOUT_WIDTH,
                        windowHeight: Math.max(element.scrollHeight, element.offsetHeight)
                    });
                }).then(function(canvas) {
                    if (restoreChrome) restoreChrome();
                    downloadCanvasPng(canvas, 'exported-image.png');
                }).catch(function(err) {
                    if (restoreChrome) restoreChrome();
                    console.error(err);
                    alert('导出失败：画布被跨域图片污染。请确认标题图标/内容图可同源访问，或重新选择图片后再试。');
                });
            });
        </script>
